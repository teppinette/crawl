# _base.yaml — shared collector skeleton. Edit HERE to enhance ALL countries.
# Overlays (verify_<cc>.yaml) `extends: _base.yaml` and supply only what varies.
# Templated fields use {{cc_upper}} {{cc_lower}} {{country_name}} {{registry_detail}}
# {{registry_source_id}}. Resolver: scripts/agent_resolve.py.

metadata:
  tier: collector
  schema_version: 1
  auditable_for_banks: true
  cost_tier: free
runtime:
  service: azure_ai_foundry_agents
  resource: copapfoundry-resource
  region: eastus2
model:
  deployment: gpt-4.1-mini-778742
  resource: copapfoundry-resource
  region: eastus2
  temperature: 0.0
  max_tokens: 4096
inputs:
- name: run_id
  type: uuid
  required: true
- name: entity_name
  type: string
  required: true
- name: registration_number
  type: string
  required: false
description: 'Collects evidence for a {{country_name}} ({{cc_upper}}) entity. Queries the {{cc_upper}} gov registry via the gateway (resolved upstream: {{registry_detail}}), CSL screening, and GLEIF LEI. Writes raw responses + extracted fields to the evidence table. Does not synthesize narrative.'
system_prompt: |
  You are the {{country_name}} ({{cc_upper}}) evidence collector. Your only job is to query
  sources and persist what they return. You do not write narrative. You do
  not synthesize. You do not invent fields. If a source returns nothing,
  still record it as an evidence row with extracted={} so the audit trail
  is complete.

  For the given entity_name and run_id, execute these steps in order:

    1. Call country_registry_lookup with country="{{cc_upper}}" and the entity_name
       (pass registration_number if provided). The response now contains
       a "primary" block (always present) AND optionally an "aggregator"
       block (OpenCorporates, when available). Persist:
         - Always: evidence_add(source_id="{{registry_source_id}}",
                                extracted=<the primary block>)
         - Only if response.aggregator is NOT null:
                   evidence_add(source_id="opencorporates",
                                extracted=<the aggregator block>)
       This yields a banker-friendly dual-source comparison per entity.

    2. Call opensanctions_search with the entity name (country="{{cc_lower}}").
       Persist via evidence_add with source_id="csl_screening".

    3. Call gleif_lei_lookup with the entity name (country="{{cc_upper}}"). Persist
       via evidence_add with source_id="gleif_lei".

  Always pass run_id to evidence_add. Always pass the exact source_url
  the tool returned. Always pass language_original.

  When all three steps are done, call collector_complete(run_id) and stop.
tools:
- $ref: ../tools/country_registry_lookup.openapi.yaml
- $ref: ../tools/opensanctions_search.openapi.yaml
- $ref: ../tools/gleif_lei_lookup.openapi.yaml
- $ref: ../tools/evidence_add.openapi.yaml
- $ref: ../tools/collector_complete.openapi.yaml
output:
  description: |
    Side effect only — 3 evidence rows written to crawl_reports.evidence (one per source), then run status transitioned to "extracting" by collector_complete.
